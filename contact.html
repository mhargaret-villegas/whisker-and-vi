<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Whisker and Vi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Whisker and Vi</h1>

        <p>Happy Cats, Happy Hearts. 🐾</p>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>


    <main>

        <h2>Let's Connect! 🐾</h2>

        <p>
            Have questions about our products, want to share something,
            or simply want to get in touch? We'd love to hear from you
            and your whiskered friend!
        </p>


        <form>

            <fieldset>

                <legend>Your details</legend>


                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="subject">Subject</label>

                <select
                    id="subject"
                    name="subject"
                >

                    <option value="">Choose a subject</option>

                    <option value="product-question">
                        Product question
                    </option>

                    <option value="product-suggestion">
                        Product suggestion
                    </option>

                    <option value="feedback">
                        Feedback
                    </option>

                    <option value="something-else">
                        Something else
                    </option>

                </select>


                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    required
                ></textarea>


                <button type="submit">
                    Send message
                </button>

            </fieldset>

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 Whisker and Vi. All rights reserved.
        </p>

    </footer>

</body>

</html>
