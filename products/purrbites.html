<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vi's PurrBites | Whisker and Vi</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="site-header">

        <div class="header-brand">

            <h1>Whisker and Vi</h1>

            <p>Happy Cats, Happy Hearts. 🐾</p>

        </div>

        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>


    <main class="product-page">

        <section class="product-container">

            <h2>Vi's PurrBites</h2>

            <img
                src="../purrbites.jpg"
                alt="A bag of Vi's PurrBites dry cat food"
                class="product-image"
            >

            <p class="product-description">
                Nutritious dry cat food made to provide cats with
                a tasty and satisfying meal every day.
            </p>

        </section>


        <section class="order-form">

            <h2>Order Vi's PurrBites</h2>

            <p>Fill out the form below to place your order.</p>

            <form>

                <div class="form-group">

                    <label for="name">Name:</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="quantity">Quantity:</label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        required
                    >

                </div>


                <button type="submit">
                    Place Order
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Whisker and Vi. All rights reserved.
        </p>

    </footer>

</body>

</html>
